<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Believe</title>
<style>
  :root {
    color-scheme: light dark;
    --surface: #ffffff; --text: #1a1512; --muted: #6b615a; --accent: #a86a1e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --surface: #100c0b; --text: #f6f0ea; --muted: #9a8e86; --accent: #e0a15c; }
  }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--surface); color: var(--text); padding: 24px;
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 28rem; text-align: center; }
  .wordmark { font-size: 13px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); margin: 0 0 20px; }
  h1 { font-size: 26px; margin: 0 0 12px; font-weight: 700; }
  p { color: var(--muted); margin: 0 0 24px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <p class="wordmark">Believe</p>
  <h1>Say it to your own face</h1>
  <p>A mirror, a phrase, your own voice. Nothing is recorded, nothing leaves your iPhone.</p>
  <p><a href="/privacy/">Privacy Policy</a> · <a href="/support/">Support</a></p>
</main>
</body>
</html>
